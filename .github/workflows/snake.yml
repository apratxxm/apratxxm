name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#4d7c0f&color_dots=#ebedf0,#d9f99d,#a3e635,#65a30d,#365314
            dist/snake-dark.svg?palette=github-dark&color_snake=#c8ff3d&color_dots=#161b22,#1a2e05,#365314,#65a30d,#c8ff3d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
